apiVersion: tenant.paas.redhat.com/v1alpha1
kind: TenantEgress
metadata:
  name: default
  namespace: your-team--pipeline
spec:
  egress:
    # Red Hat internal
    - to:
        cidrSelector: 172.0.0.0/8
      type: Allow
    - to:
        cidrSelector: 10.0.0.0/9
      type: Allow

    # GitHub
    - type: Allow
      to:
        dnsName: github.com
    - type: Allow
      to:
        dnsName: githubusercontent.com
    - type: Allow
      to:
        dnsName: objects.githubusercontent.com
    - to:
        cidrSelector: 140.82.112.0/20
      type: Allow

    # PyPI & Python package hosting
    - type: Allow
      to:
        dnsName: pypi.org
    - type: Allow
      to:
        dnsName: pythonhosted.org
    - type: Allow
      to:
        dnsName: files.pythonhosted.org

    # Ubuntu & container registries
    - type: Allow
      to:
        dnsName: cloud-images.ubuntu.com
    - type: Allow
      to:
        dnsName: archive.ubuntu.com
    - type: Allow
      to:
        dnsName: security.ubuntu.com
    - type: Allow
      to:
        dnsName: ppa.launchpad.net
    - type: Allow
      to:
        dnsName: quay.io
    - type: Allow
      to:
        dnsName: production.cloudflare.docker.com
    - type: Allow
      to:
        dnsName: download.cirros-cloud.net
    # Ubuntu PPA API, Keyservers, and Content Networks
    - type: Allow
      to:
        dnsName: api.launchpad.net
    - type: Allow
      to:
        dnsName: ppa.launchpadcontent.net
    - type: Allow
      to:
        dnsName: keyserver.ubuntu.com
    # ADD THESE IP BLOCKS DIRECTLY:
    - type: Allow
      to:
        cidrSelector: 185.125.190.0/24  # Covers Launchpad's primary IPv4 range
    - type: Allow
      to:
        cidrSelector: 2620:2d:4000::/48  # Covers Launchpad's primary IPv6 range

    # Ubuntu & container registries
    - type: Allow
      to:
        dnsName: ppa.launchpadcontent.net
      # If your proxy provider supports it, enforce an TLS-passthrough or blind routing option:
      backend: passthrough 

    #
    # Allow access to OpenDev
    #
    # Rationale: contains official OpenStack upstream source code repositories
    #            (the releases page hosts shortcuts to the constraints files).
    #
    - type: Allow
      to:
        dnsName: opendev.org

    - type: Allow
      to:
        dnsName: review.opendev.org

    - type: Allow
      to:
        dnsName: tarballs.opendev.org

    - type: Allow
      to:
        dnsName: releases.openstack.org

    #
    # Google Cloud APIs (for Vertex AI and other GCP services)
    #
    # Rationale: enables Vertex AI SDK, Cloud Storage, and other GCP APIs
    #
    - type: Allow
      to:
        dnsName: googleapis.com
    - type: Allow
      to:
        dnsName: storage.googleapis.com
    - type: Allow
      to:
        dnsName: aiplatform.googleapis.com
    - type: Allow
      to:
        dnsName: ml.googleapis.com
    - type: Allow
      to:
        dnsName: cloudresourcemanager.googleapis.com
    - type: Allow
      to:
        dnsName: iam.googleapis.com
    - type: Allow
      to:
        dnsName: serviceusage.googleapis.com
    - type: Allow
      to:
        dnsName: oauth2.googleapis.com
    - type: Allow
      to:
        dnsName: www.googleapis.com
    - type: Allow
      to:
        dnsName: accounts.google.com
    # Google Cloud package repositories
    - type: Allow
      to:
        dnsName: packages.cloud.google.com
    # GCP IP ranges (Google services)
    - type: Allow
      to:
        cidrSelector: 34.64.0.0/10      # Google Cloud Platform services
    - type: Allow
      to:
        cidrSelector: 35.184.0.0/13     # Google Cloud Platform services
